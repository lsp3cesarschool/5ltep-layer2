schema_version: "1.0"
rule_version: "0.1.0"
origin: expert

description:
  language: pt-BR
  title: "Lavratura mais de cinco anos depois do fato"
  title_translations:
    en: "Notice issued more than five years after the offence"
  text: >
    Sinaliza autos lavrados mais de cinco anos depois do fato infracional (ou com o fato posterior à lavratura).
  justification: >
    O Decreto 6.514/2008, art. 21, fixa em cinco anos a prescrição da ação punitiva, contados do fato.
    O lapso é hipótese de triagem para exame jurídico: interrupções, infração permanente e outras
    hipóteses mudam a contagem. A regra não declara prescrição.
  exceptions:
    - "Infração permanente ou continuada conta o prazo do fim da conduta."
    - "Atos que interrompem a prescrição não aparecem nestes dados."
  examples:
    - case: "Fato em 2010-01-01, lavratura em 2014-12-31"
      expected: "Conforme"
    - case: "Fato em 2010-01-01, lavratura em 2016-01-02"
      expected: "Sinal: mais de cinco anos"

sources:
  ibama_autos:
    portal: https://dadosabertos.ibama.gov.br
    dataset: fiscalizacao-auto-de-infracao
    resource: {name: "Autos de infração", format: CSV}
    archive: {type: zip, members: "auto_infracao_*.csv"}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      DT_FATO_INFRACIONAL: {meaning: "Data do fato infracional", type: date, format: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d"]}
      DAT_HORA_AUTO_INFRACAO: {meaning: "Data e hora de lavratura do auto", type: date, format: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d"]}

check:
  template: temporal-order
  sequence: [ibama_autos.DT_FATO_INFRACIONAL, ibama_autos.DAT_HORA_AUTO_INFRACAO]
  max_interval: {years: 5}
