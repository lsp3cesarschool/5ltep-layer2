schema_version: "1.0"
rule_version: "0.1.0"
origin: cross_reference

description:
  language: pt-BR
  title: "Auto ativo do SICAFI sem enquadramento publicado"
  title_translations:
    en: "Active SICAFI notice without a published legal basis"
  text: >
    Confere se cada auto não cancelado, registrado no SICAFI, tem ao menos um enquadramento legal no extrato de enquadramentos.
  justification: >
    Todo auto precisa de enquadramento legal. A regra se limita aos autos do SICAFI porque os autos do
    AI-e publicam o enquadramento em outro recurso (Sabiá/AIe Mob). É sinal para revisão, não veredito sobre o auto.
  exceptions:
    - "Autos cancelados (SIT_CANCELADO = S) ou do AI-e ficam fora do escopo."
    - "O enquadramento pode existir no sistema e não ter sido publicado no extrato."
  examples:
    - case: "Auto SICAFI não cancelado com enquadramento publicado"
      expected: "Conforme"
    - case: "Auto SICAFI não cancelado sem nenhum enquadramento"
      expected: "Sinal"

sources:
  ibama_autos:
    portal: https://dadosabertos.ibama.gov.br
    dataset: fiscalizacao-auto-de-infracao
    resource: {name: "Autos de infração", format: CSV}
    archive: {type: zip, members: "auto_infracao_*.csv"}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      SEQ_AUTO_INFRACAO: "Identificador sequencial do auto de infração"
      SIT_CANCELADO: "S quando o auto foi cancelado, N quando não"
      TP_ORIGEM_REGISTRO_AUTO: "Sistema em que o auto foi registrado (SICAFI ou AI-e)"
  ibama_enquadramento:
    portal: https://dadosabertos.ibama.gov.br
    dataset: fiscalizacao-auto-de-infracao
    resource: {name: "Autos de infração - enquadramento legal", format: CSV}
    archive: {type: zip, members: "enquadramento_*.csv"}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      SEQ_AUTO_INFRACAO: "Identificador sequencial do auto de infração"

check:
  template: lookup-exists
  key: {from: ibama_autos.SEQ_AUTO_INFRACAO, to: ibama_enquadramento.SEQ_AUTO_INFRACAO}
  where:
    - {column: ibama_autos.SIT_CANCELADO, equals: "N"}
    - {column: ibama_autos.TP_ORIGEM_REGISTRO_AUTO, equals: "SICAFI"}
